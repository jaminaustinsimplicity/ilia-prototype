<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>ILIA Design Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--md-sys-color-primary:#2A62E4;--md-sys-color-on-primary:#FFFFFF;--ilia-success:#18A862;--ilia-warning:#E6A82E;}
    body{font-family:Roboto,sans-serif;margin:0;padding:0;background:#FDFBFF;}
    header{background:var(--md-sys-color-primary);color:#fff;padding:20px 24px;}
    h1{margin:0;font-weight:500;}
    main{max-width:980px;margin:0 auto;padding:24px;}
    .swatch{display:inline-block;width:120px;height:60px;border-radius:8px;margin:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:500;}
  </style>
</head>
<body>
  <header><h1>ILIA Design Guide</h1><p>MD3 component reference with ILIA brand palette.</p></header>
  <main>
    <h2>Color Palette</h2>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px;">
      <div class="swatch" style="background:#2A62E4">Primary<br>#2A62E4</div>
      <div class="swatch" style="background:#565E71">Secondary<br>#565E71</div>
      <div class="swatch" style="background:#1E8E4E">Tertiary<br>#1E8E4E</div>
      <div class="swatch" style="background:#18A862">Success<br>#18A862</div>
      <div class="swatch" style="background:#E6A82E;color:#3D2C00">Warning<br>#E6A82E</div>
      <div class="swatch" style="background:#BA1A1A">Error<br>#BA1A1A</div>
    </div>
    <p><a href="index.html">← Back to prototype index</a></p>
  </main>
</body>
</html>
